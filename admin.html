<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070a18">
<title>Гости — админка приглашения</title>
<link rel="stylesheet" href="assets/common.css?v=6">
<style>
  body { background: linear-gradient(#070a18, #121a3a) fixed; color: #f3e9d6; min-height: 100vh; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 80px; }
  h1 { font: 400 clamp(36px, 9vw, 52px)/1.1 var(--script); margin: 8px 0 2px; color: #fbefd8; text-align: center; }
  h1 span { color: #d6b780; }
  .sub { text-align: center; margin: 0 0 20px; color: #c9bca6; font-style: italic; font-size: 19px; }
  .card { background: rgba(255, 255, 255, .05); border: 1px solid rgba(214, 183, 128, .35); border-radius: 14px; padding: 18px 16px; margin-bottom: 14px; }
  .field { display: block; width: 100%; padding: 12px 14px; font: 20px var(--serif); color: inherit; background: rgba(0, 0, 0, .25); border: 1px solid rgba(214, 183, 128, .5); border-radius: 12px; }
  .field::placeholder { color: inherit; opacity: .5; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row .field { flex: 1 1 220px; }
  .btn { color: #f3e9d6; }
  .btn--solid, .btn:hover, .btn.is-active { background: #d6b780; color: #1a1430; }
  .btn--sm { font-size: 16px; padding: 7px 14px; }
  .btn--danger { border-color: rgba(232, 160, 168, .6); color: #e8a0a8; }
  .btn--danger:hover { background: #e8a0a8; color: #1a1430; }
  .label { margin: 0 0 10px; font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: #d6b780; }
  .err { color: #e8a0a8; margin: 10px 0 0; font-size: 18px; }
  .err:empty { display: none; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { text-align: center; padding: 12px 6px; border-radius: 12px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(214, 183, 128, .25); }
  .stat b { display: block; font-size: 32px; font-weight: 500; line-height: 1.1; }
  .stat small { font-size: 14px; color: #c9bca6; }
  .stat--yes b { color: #a8d8a0; } .stat--no b { color: #e8a0a8; }
  @media (max-width: 480px) { .stats { grid-template-columns: repeat(2, 1fr); } }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; }
  .guest { padding: 14px 16px; }
  .guest__top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .guest__name { font-size: 23px; margin: 0; }
  .chip { font-size: 16px; padding: 3px 12px; border-radius: 999px; white-space: nowrap; border: 1px solid; }
  .chip--yes { color: #a8d8a0; border-color: rgba(168, 216, 160, .5); }
  .chip--no { color: #e8a0a8; border-color: rgba(232, 160, 168, .5); }
  .chip--wait { color: #c9bca6; border-color: rgba(201, 188, 166, .4); }
  .guest__meta { margin: 4px 0 10px; color: #c9bca6; font-size: 16px; }
  .guest__link { width: 100%; font: 15px ui-monospace, monospace; color: #f3dcae; background: rgba(0, 0, 0, .25); border: 1px dashed rgba(214, 183, 128, .4); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
  .guest.is-new { border-color: #f3dcae; box-shadow: 0 0 0 1px #f3dcae, 0 0 24px rgba(243, 220, 174, .25); }
  .empty { text-align: center; color: #c9bca6; font-style: italic; font-size: 19px; padding: 20px 0; }
  .topbar { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub">Гости и их ответы</p>

  <section class="card" id="setup" hidden>
    <p class="label">Ответы ещё не подключены</p>
    <p style="margin:0;font-size:19px">Создайте Google Таблицу со скриптом из <b>apps-script/Code.gs</b> и вставьте ссылку веб-приложения в <b>WEDDING.api</b> в <b>assets/common.js</b>.</p>
  </section>

  <section class="card" id="login" hidden>
    <p class="label">Вход</p>
    <form class="row" id="loginForm">
      <input class="field" id="key" type="password" placeholder="Пароль" autocomplete="current-password">
      <button class="btn btn--solid">Войти</button>
    </form>
    <p class="err" id="loginErr"></p>
  </section>

  <div id="app" hidden>
    <div class="topbar">
      <button class="btn btn--sm" id="refresh">Обновить</button>
      <button class="btn btn--sm" id="logout">Выйти</button>
    </div>

    <div class="stats">
      <div class="stat"><b id="sLinks">0</b><small>приглашений</small></div>
      <div class="stat stat--yes"><b id="sYes">0</b><small>человек придут</small></div>
      <div class="stat stat--no"><b id="sNo">0</b><small>не придут</small></div>
      <div class="stat"><b id="sWait">0</b><small>ждём ответа</small></div>
    </div>

    <section class="card">
      <p class="label">Новый гость</p>
      <form class="row" id="addForm">
        <input class="field" id="newName" placeholder="Например: Фаррух и Нигора" maxlength="80">
        <button class="btn btn--solid">Создать ссылку</button>
      </form>
      <p class="err" id="addErr"></p>
    </section>

    <input class="field" id="search" placeholder="Поиск по имени" style="margin-bottom:10px">
    <div class="filters" id="filters">
      <button class="btn btn--sm is-active" data-f="all">Все</button>
      <button class="btn btn--sm" data-f="yes">Придут</button>
      <button class="btn btn--sm" data-f="no">Не придут</button>
      <button class="btn btn--sm" data-f="wait">Ждём</button>
    </div>
    <div id="list"></div>
  </div>
</main>

<script src="assets/common.js?v=6"></script>
<script>
const w = WEDDING;
const $ = id => document.getElementById(id);
const KEY_STORE = 'invite-admin-key';
let key = '', guests = [], filter = 'all', freshId = '';

$('title').innerHTML = `${w.groom} <span>&</span> ${w.bride}`;

const store = {
  get() { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } },
  set(v) { try { v ? localStorage.setItem(KEY_STORE, v) : localStorage.removeItem(KEY_STORE); } catch (e) { /* приватный режим */ } },
};

const linkFor = id => location.href.replace(/admin\.html.*$/, '') + '?g=' + id;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = d => d ? new Date(d).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : '';
const inviteText = g => `${g.name}, ${w.groom} и ${w.bride} приглашают вас на свою свадьбу ${w.dateText}! Ваше приглашение:`;

function show(view) {
  for (const id of ['setup', 'login', 'app']) $(id).hidden = id !== view;
}

async function load() {
  const r = await api({ action: 'list', key });
  if (!r.ok) throw new Error(r.error || 'list');
  guests = r.guests.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  render();
}

function render() {
  const yes = guests.filter(g => g.answer === 'yes');
  $('sLinks').textContent = guests.filter(g => !g.shared).length;
  $('sYes').textContent = yes.reduce((n, g) => n + (Number(g.people) || 1), 0);
  $('sNo').textContent = guests.filter(g => g.answer === 'no').length;
  $('sWait').textContent = guests.filter(g => !g.answer).length;

  const q = $('search').value.trim().toLowerCase();
  const shown = guests.filter(g =>
    (filter === 'all' || (filter === 'wait' ? !g.answer : g.answer === filter)) &&
    (!q || g.name.toLowerCase().includes(q)));

  $('list').innerHTML = shown.length ? shown.map(g => {
    const chip = g.answer === 'yes' ? `<span class="chip chip--yes">Придёт · ${g.people || 1} чел.</span>`
      : g.answer === 'no' ? '<span class="chip chip--no">Не придёт</span>'
      : '<span class="chip chip--wait">Ждём ответа</span>';
    const meta = [g.shared ? 'ответил по общей ссылке' : '', g.answeredAt ? 'ответ ' + when(g.answeredAt) : 'создано ' + when(g.createdAt)]
      .filter(Boolean).join(' · ');
    const personal = g.shared ? '' : `
      <input class="guest__link" readonly value="${esc(linkFor(g.id))}">
      <div class="row">
        <button class="btn btn--sm btn--solid" data-act="copy">Копировать</button>
        <button class="btn btn--sm" data-act="wa">WhatsApp</button>
        <button class="btn btn--sm" data-act="tg">Telegram</button>
        <button class="btn btn--sm btn--danger" data-act="del">Удалить</button>
      </div>`;
    return `<div class="card guest ${g.id === freshId ? 'is-new' : ''}" data-id="${esc(g.id)}">
      <div class="guest__top"><p class="guest__name">${esc(g.name)}</p>${chip}</div>
      <p class="guest__meta">${meta}</p>
      ${personal || '<div class="row"><button class="btn btn--sm btn--danger" data-act="del">Удалить</button></div>'}
    </div>`;
  }).join('') : '<p class="empty">Здесь пока никого нет</p>';
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); showToast('Ссылка скопирована'); }
  catch (e) { showToast('Не получилось скопировать — выделите ссылку вручную'); }
}

$('list').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const card = b.closest('.guest');
  const g = guests.find(x => x.id === card.dataset.id);
  const link = linkFor(g.id);
  if (b.dataset.act === 'copy') copy(link);
  if (b.dataset.act === 'wa') window.open('https://wa.me/?text=' + encodeURIComponent(inviteText(g) + ' ' + link), '_blank', 'noopener');
  if (b.dataset.act === 'tg') window.open('https://t.me/share/url?' + new URLSearchParams({ url: link, text: inviteText(g) }), '_blank', 'noopener');
  if (b.dataset.act === 'del') {
    if (!confirm(`Удалить «${g.name}»? Ссылка перестанет работать.`)) return;
    b.disabled = true;
    const r = await api({ action: 'remove', id: g.id, key }).catch(() => ({}));
    if (r.ok) { guests = guests.filter(x => x !== g); render(); showToast('Удалено'); }
    else { b.disabled = false; showToast('Не получилось удалить'); }
  }
});
$('list').addEventListener('focusin', e => e.target.classList.contains('guest__link') && e.target.select());

$('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('newName').value.trim();
  $('addErr').textContent = '';
  if (!name) { $('addErr').textContent = 'Впишите имя гостя'; $('newName').focus(); return; }
  const btn = e.submitter || $('addForm').querySelector('button');
  btn.disabled = true;
  try {
    const r = await api({ action: 'add', name, key });
    if (!r.ok) throw new Error(r.error);
    guests.unshift(r.guest);
    freshId = r.guest.id;
    $('newName').value = '';
    filter = 'all';
    document.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('is-active', x.dataset.f === 'all'));
    render();
    copy(linkFor(r.guest.id));
  } catch (err) {
    $('addErr').textContent = 'Не получилось создать. Проверьте интернет.';
  }
  btn.disabled = false;
});

$('filters').addEventListener('click', e => {
  const b = e.target.closest('[data-f]');
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('is-active', x === b));
  render();
});
$('search').addEventListener('input', render);
$('refresh').addEventListener('click', () => load().then(() => showToast('Обновлено')).catch(() => showToast('Не получилось обновить')));
$('logout').addEventListener('click', () => { store.set(''); key = ''; show('login'); });

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  key = $('key').value.trim();
  $('loginErr').textContent = '';
  try {
    await load();
    store.set(key);
    show('app');
  } catch (err) {
    $('loginErr').textContent = err.message === 'key' ? 'Неверный пароль' : 'Нет связи с таблицей';
  }
});

(async () => {
  if (!API_URL) return show('setup');
  key = store.get();
  if (!key) return show('login');
  try { await load(); show('app'); } catch (e) { show('login'); }
})();
</script>
</body>
</html>
